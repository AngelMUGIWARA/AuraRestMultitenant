packages:
  - 'apps/backend'
  - 'apps/web-shell'
  - 'apps/menu-mf'
  - 'apps/kitchen-mf'
  - 'apps/cashier-mf'
  - 'apps/core_auth_dashboard_mf'
  - 'apps/orders_tables_mf'
  - 'apps/reservations_reports_mf'

  - 'packages/*'
  - 'dev-cli'

shamhoist-ignore:
  - '@types/**'
  - 'eslint*'
  - 'prettier*'
  - '@testing-library/**'

node-linker: 'hoisted'

allowBuilds:
  '@prisma/client': true
  '@prisma/engines': true
  '@scarf/scarf': false
  '@swc/core': true
  bcrypt: true
  core-js: true
  esbuild: true
  prisma: true
  sharp: true
  unrs-resolver: true
