services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: aura_rest
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: .
    ports:
      - "${PORT:-4000}:4000"
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      PORT: 4000
      DATABASE_URL: ${DATABASE_URL:-postgresql://postgres:postgres@postgres:5432/aura_rest}
      TENANT_DATABASE_URL: ${TENANT_DATABASE_URL:-postgresql://postgres:postgres@postgres:5432/aura_rest?schema=tenant_ejemplo}
      JWT_SECRET: ${JWT_SECRET:-cambia_este_secreto_por_uno_seguro_en_produccion}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-cambia_este_secreto_por_otro_seguro_en_produccion}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3030}
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata:
